name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 rsync openssh-server
          sudo mkdir -p /run/sshd
      - run: go test -race ./...
      - run: go vet ./...
      - name: Real SSH integration
        if: runner.os == 'Linux'
        run: ASA_SSH_TEST=1 go test ./... -count=1
      - run: go build ./cmd/agent-session-archiver
